<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KZEL Functional Command Center Prototype</title>
<style>
:root{
  --bg:#050607;--panel:#0a0d10;--panel2:#0e1217;--line:#202630;--line2:#2d3540;
  --text:#f3f4f6;--muted:#8a939f;--green:#47dc87;--amber:#f4b44d;--red:#ff6d72;--blue:#66a7ff;
  --radius:14px;--shadow:0 18px 55px rgba(0,0,0,.34)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
body{overflow:hidden}
.shell{height:100vh;display:grid;grid-template-columns:205px minmax(0,1fr) 370px;background:
 radial-gradient(circle at 26% -12%,rgba(255,255,255,.07),transparent 31%),var(--bg)}
.sidebar{border-right:1px solid var(--line);background:linear-gradient(180deg,#080a0d,#050607);padding:16px 12px;display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:10px;margin:0 4px 18px}
.brand img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:1px solid #323942}
.brand b{display:block;font-size:22px;letter-spacing:.09em}
.brand span{display:block;font-size:9px;color:var(--muted);letter-spacing:.14em;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px;overflow:auto;padding-bottom:10px}
.nav button{border:0;background:transparent;color:#aab2bd;text-align:left;border-radius:9px;padding:10px 11px;display:flex;align-items:center;gap:9px;font-size:12px}
.nav button:hover,.nav button.active{background:#11151a;color:#fff;box-shadow:inset 2px 0 0 #fff}
.sidebar-bottom{margin-top:auto;display:grid;gap:8px}
.status-card{border:1px solid var(--line);border-radius:12px;background:#0b0e12;padding:10px;display:flex;gap:9px;align-items:center}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(71,220,135,.8)}
.status-card small,.status-card span{display:block;color:var(--muted);font-size:9px}
.status-card strong{display:block;font-size:12px;color:var(--green)}
.ghost{border:1px solid var(--line2);background:#0c1014;color:#cbd1d9;border-radius:9px;padding:8px 10px;font-size:11px}
.ghost:hover{background:#14191f}
.main{overflow:auto;min-width:0}
.topbar{position:sticky;top:0;z-index:10;padding:16px 20px;background:rgba(5,6,7,.91);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.topbar h1{font-size:18px;margin:0;letter-spacing:.035em}
.topbar p{font-size:11px;color:var(--muted);margin:4px 0 0}
.top-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{border:1px solid var(--line2);background:#0d1116;border-radius:8px;padding:7px 9px;font-size:10px;color:#b9c0ca}
.badge.good{color:var(--green)} .badge.warn{color:var(--amber)} .badge.bad{color:var(--red)}
.primary{border:0;background:#f3f4f6;color:#050607;font-weight:800;border-radius:9px;padding:8px 11px;font-size:11px}
.content{padding:18px 20px 96px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 9px;gap:10px}
.section-head h2{font-size:13px;margin:0;letter-spacing:.03em}
.muted{color:var(--muted)} .tiny{font-size:9px}.small{font-size:10px}
.grid{display:grid;gap:11px}.metrics{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:linear-gradient(180deg,var(--panel2),#090b0e);border:1px solid var(--line);border-radius:var(--radius);padding:13px;box-shadow:0 7px 20px rgba(0,0,0,.12);min-width:0}
.card h3{font-size:10px;color:#aab2bc;font-weight:600;margin:0 0 7px;text-transform:uppercase;letter-spacing:.035em}
.value{font-size:25px;font-weight:900;line-height:1.05}.value.big{font-size:50px}
.note{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.4}
.green{color:var(--green)!important}.amber{color:var(--amber)!important}.red{color:var(--red)!important}.blue{color:var(--blue)!important}
.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:1.2fr 1fr .9fr}.four{grid-template-columns:repeat(4,1fr)}
.hero{min-height:175px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;bottom:-100px;width:270px;height:270px;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 64%);pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.chip,.tag{border:1px solid var(--line2);border-radius:999px;background:#11161b;padding:4px 7px;font-size:9px;color:#bcc4ce}
.tag.good{color:var(--green);border-color:#22563a}.tag.warn{color:var(--amber);border-color:#5e4826}.tag.bad{color:var(--red);border-color:#5e2529}
.pipeline{display:grid;grid-template-columns:repeat(11,minmax(74px,1fr));gap:7px;overflow-x:auto;padding-bottom:4px}
.stage{border:1px solid var(--line);background:#0b0e12;border-radius:11px;padding:10px 6px;text-align:center;position:relative;min-width:74px;transition:.25s ease}
.stage.hot{border-color:#536070;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 22px rgba(255,255,255,.04)}
.stage.degraded{border-color:#7c5c28;background:#161107}
.stage .ico{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;border:1px solid #3a444f;font-size:10px}
.stage b{display:block;font-size:9px}.stage strong{font-size:15px}
.stage small{font-size:8px;color:var(--muted);display:block;margin-top:3px}
.stage::after{content:"";position:absolute;left:100%;top:23px;width:8px;height:1px;background:#39414b}
.stage:last-child::after{display:none}
.token-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.token-card{border:1px solid var(--line);background:#0b0e12;border-radius:12px;padding:11px;transition:.2s;cursor:pointer;position:relative}
.token-card:hover{transform:translateY(-1px);border-color:#39434f}
.token-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.token-id{display:flex;align-items:center;gap:8px;min-width:0}.coin{width:31px;height:31px;border-radius:50%;background:linear-gradient(145deg,#f8f8f8,#3a3f46);border:1px solid #818790;flex:0 0 auto}
.token-id b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.token-id span{font-size:9px;color:var(--muted)}
.scoreline{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.mini{border:1px solid #202630;background:#0d1115;border-radius:8px;padding:6px;text-align:center}.mini b{font-size:12px;display:block}.mini span{font-size:7px;color:var(--muted)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:10px;min-width:650px}.table th,.table td{padding:8px;border-bottom:1px solid #191e24;text-align:left}.table th{color:#79838f;font-weight:500}.table tr.clickable{cursor:pointer}.table tr.clickable:hover{background:#0e1217}
.list{display:flex;flex-direction:column}.list-item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #191e24;font-size:10px}.list-item:last-child{border-bottom:0}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);margin-top:4px;flex:0 0 auto}
.progress{height:6px;border-radius:999px;background:#171c22;overflow:hidden;margin-top:7px}.progress span{height:100%;display:block;background:linear-gradient(90deg,#3dd87f,#f5f5f5)}
.service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.service{border:1px solid var(--line);background:#0b0e12;border-radius:10px;padding:10px}.service-head{display:flex;justify-content:space-between;gap:8px;font-size:10px}.service-meta{font-size:8px;color:var(--muted);margin-top:6px}.service-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.service-actions button{border:1px solid var(--line2);background:#11161b;color:#ccd2da;padding:4px 6px;border-radius:7px;font-size:8px}
.tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:10px}.tabs button{border:0;background:transparent;color:#808996;padding:6px 8px;font-size:9px;white-space:nowrap;border-radius:7px}.tabs button.active{background:#14191f;color:#fff}
.timeline{display:flex;flex-direction:column;gap:0}.event{display:grid;grid-template-columns:70px 11px 1fr;gap:8px;min-height:43px}.event time{font-size:8px;color:#737d89;padding-top:2px}.event i{width:8px;height:8px;border-radius:50%;background:#5a6470;margin-top:2px;position:relative}.event i:after{content:"";position:absolute;left:3px;top:8px;width:1px;height:35px;background:#242b33}.event:last-child i:after{display:none}.event p{margin:0;font-size:10px;line-height:1.4}
.wallet-map{height:300px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at center,#121820,transparent 58%),#080a0d;position:relative;overflow:hidden}.bubble{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center;border:1px solid #455160;background:rgba(255,255,255,.06);font-size:8px}.bubble.r{border-color:#ff7277;background:rgba(255,85,90,.12)}.bubble.g{border-color:#47dc87;background:rgba(71,220,135,.11)}
.agent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.agent{border:1px solid var(--line);background:#0b0e12;border-radius:12px;padding:11px}.agent-top{display:flex;justify-content:space-between;gap:8px}.agent h4{font-size:11px;margin:0}.agent p{font-size:9px;color:var(--muted);line-height:1.4}.pulse{width:8px;height:8px;border-radius:50%;background:#59616b}.pulse.working{background:var(--green);animation:pulse 1.1s infinite}.pulse.failed{background:var(--red)}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(71,220,135,0)}0%{box-shadow:0 0 0 0 rgba(71,220,135,.25)}}
.task-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.task-col{border:1px solid var(--line);background:#090c0f;border-radius:12px;padding:10px}.task-card{border:1px solid #252c35;background:#0d1115;border-radius:9px;padding:9px;margin-top:7px}.task-card b{font-size:10px}.task-card p{font-size:8px;color:var(--muted);margin:5px 0}.task-actions{display:flex;gap:5px;flex-wrap:wrap}.task-actions button{border:1px solid var(--line2);background:#11161b;color:#cbd1d9;border-radius:6px;padding:4px 6px;font-size:8px}
.memory-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.memory-item{border:1px solid var(--line);background:#0b0e12;border-radius:11px;padding:10px}.memory-item h4{font-size:10px;margin:7px 0 4px}.memory-item p{font-size:9px;color:var(--muted);line-height:1.45;margin:0}.memory-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px}.field label{font-size:8px;color:var(--muted)}.field input,.field select,.field textarea,.search-input{background:#090c0f;border:1px solid var(--line2);border-radius:8px;color:#fff;padding:9px;font-size:10px;width:100%}.field textarea{min-height:70px;resize:vertical}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}.btn{border:1px solid var(--line2);background:#11161b;color:#d1d6dd;border-radius:8px;padding:7px 9px;font-size:9px}.btn.good{border-color:#275b3e;color:#5de096}.btn.warn{border-color:#624b27;color:#f4b44d}.btn.bad{border-color:#61282d;color:#ff777b}
.shadow-chart{height:210px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(71,220,135,.06),transparent),repeating-linear-gradient(135deg,transparent,transparent 12px,rgba(255,255,255,.022) 12px,rgba(255,255,255,.022) 13px);position:relative;overflow:hidden}
.shadow-chart svg{position:absolute;inset:0;width:100%;height:100%}
.review-block{border-left:2px solid #3c4652;padding-left:10px;margin:10px 0}.review-block h4{font-size:10px;margin:0 0 5px}.review-block p{font-size:9px;color:var(--muted);line-height:1.45;margin:0}
.commander{border-left:1px solid var(--line);background:#07090b;display:flex;flex-direction:column;min-width:0}
.commander:not(.open){display:none}
.commander-head{display:flex;justify-content:space-between;align-items:center;padding:13px;border-bottom:1px solid var(--line)}
.cmd-id{display:flex;align-items:center;gap:8px}.cmd-id img{width:37px;height:37px;border-radius:50%;object-fit:cover}.cmd-id b{font-size:12px}.cmd-id span{display:block;color:var(--green);font-size:8px}.icon{border:0;background:transparent;color:#9aa2ac;font-size:20px}
.brief{margin:10px;border:1px solid var(--line);background:#0d1115;border-radius:11px;padding:10px}.brief small{color:#78818d;font-size:8px}.brief p{font-size:10px;line-height:1.45;margin:6px 0 0}
.quick{padding:0 10px 8px;display:flex;gap:5px;flex-wrap:wrap}.quick button{border:1px solid var(--line2);background:#0d1115;color:#bfc6cf;border-radius:999px;padding:5px 7px;font-size:8px}
.chat{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.msg{border:1px solid var(--line);background:#0b0e12;border-radius:11px;padding:9px}.msg.user{background:#14191f}.msg small{font-size:8px;color:#737d88}.msg p{font-size:10px;line-height:1.45;margin:5px 0 0}.tool-call{margin-top:6px;border-top:1px solid #202630;padding-top:6px;color:#9da6b1;font-size:8px}
.compose{border-top:1px solid var(--line);padding:10px}.compose textarea{width:100%;height:70px;resize:none;background:#090c0f;border:1px solid var(--line2);border-radius:9px;color:#fff;padding:9px;font-size:10px}.compose button{width:100%;margin-top:6px}
.mobile-fab{display:none;position:fixed;right:17px;bottom:18px;z-index:40;width:58px;height:58px;border-radius:50%;border:1px solid #3b4652;background:#0c1014;color:#fff;font-weight:900;box-shadow:var(--shadow)}
.mobile-menu{display:none}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);z-index:100;background:#11161b;border:1px solid #313944;border-radius:9px;color:#e7eaee;padding:9px 11px;font-size:9px;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:70;padding:24px;overflow:auto}.modal-backdrop.open{display:block}.modal{max-width:1050px;margin:auto;background:#07090b;border:1px solid #2a323d;border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.modal-head{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:14px;margin:0}.modal-body{padding:14px}
.sim-bar{position:fixed;left:218px;right:382px;bottom:12px;z-index:15;display:flex;justify-content:center;pointer-events:none}.sim-inner{pointer-events:auto;border:1px solid #313944;background:rgba(10,13,16,.94);backdrop-filter:blur(10px);border-radius:999px;padding:6px;display:flex;gap:5px;box-shadow:var(--shadow)}.sim-inner button{border:0;background:#151a20;color:#d5dae1;border-radius:999px;padding:6px 9px;font-size:8px}.sim-inner button.active{background:#eef0f2;color:#050607;font-weight:800}
.search-results{position:absolute;top:52px;right:20px;width:min(480px,calc(100vw - 40px));max-height:420px;overflow:auto;background:#090c0f;border:1px solid #303844;border-radius:11px;box-shadow:var(--shadow);z-index:30;display:none}.search-results.open{display:block}.search-result{padding:9px 10px;border-bottom:1px solid #1d232a;cursor:pointer}.search-result:hover{background:#11161b}.search-result b{font-size:10px}.search-result span{font-size:8px;color:var(--muted);display:block;margin-top:2px}
@media(max-width:1280px){
 .shell{grid-template-columns:185px minmax(0,1fr)}.commander{position:fixed;right:0;top:0;bottom:0;width:370px;z-index:60;box-shadow:-20px 0 55px rgba(0,0,0,.45)}
 .sim-bar{left:195px;right:12px}.metrics{grid-template-columns:repeat(3,1fr)}.two,.three{grid-template-columns:1fr}.service-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:780px){
 body{overflow:auto}.shell{display:block;height:auto;min-height:100vh}.sidebar{position:sticky;top:0;z-index:50;height:56px;padding:6px 8px;flex-direction:row;align-items:center;overflow:hidden}.brand{margin:0 5px 0 0}.brand img{width:42px;height:42px}.brand b,.brand span,.sidebar-bottom{display:none}.nav{flex-direction:row;overflow-x:auto;gap:2px}.nav button{font-size:0;padding:9px}.nav button span.ico-t{font-size:15px}.nav button .nav-label{display:none}.main{overflow:visible}.topbar{top:56px;padding:11px 12px}.topbar h1{font-size:14px}.topbar p{font-size:9px}.top-actions .badge{display:none}.content{padding:12px 12px 110px}.metrics{grid-template-columns:repeat(2,1fr)}.value{font-size:21px}.value.big{font-size:42px}.token-grid{grid-template-columns:1fr}.service-grid{grid-template-columns:1fr}.agent-grid{grid-template-columns:1fr}.task-board{grid-template-columns:1fr}.memory-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.commander{width:100%;left:0}.mobile-fab{display:block}.sim-bar{left:10px;right:10px;bottom:8px}.sim-inner{max-width:calc(100vw - 20px);overflow:auto;justify-content:flex-start}.pipeline{grid-template-columns:repeat(11,86px)}.four{grid-template-columns:repeat(2,1fr)}.modal-backdrop{padding:8px}.modal{border-radius:12px}.top-actions .search-wrap{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img id="brandLogo"><div><b>KZEL</b><span>AI TRADING OPERATING SYSTEM</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-bottom">
      <div class="status-card"><i class="status-dot" id="globalDot"></i><div><small>KZEL STATUS</small><strong id="globalStatus">ONLINE</strong><span>Isolated prototype</span></div></div>
      <button class="ghost" id="quickCaptureBtn">＋ Quick Capture</button>
      <button class="ghost" id="resetBtn">↺ Reset Demo</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1 id="pageTitle">KZEL COMMAND CENTRE</h1><p id="pageSubtitle">Functional isolated prototype</p></div>
      <div class="top-actions">
        <div class="search-wrap"><input id="globalSearch" class="search-input" placeholder="Search token, task, memory..." style="width:230px"></div>
        <span class="badge">PROTOTYPE</span>
        <span class="badge good" id="healthBadge">HEALTHY</span>
        <button class="ghost" id="topCaptureBtn">＋ Capture</button><button class="primary" id="talkBtn">Talk to KZEL</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </header>
    <section class="content" id="content"></section>
  </main>

  <aside class="commander" id="commander">
    <div class="commander-head">
      <div class="cmd-id"><img id="commanderLogo"><div><b>KZEL Commander</b><span>STATE-AWARE PROTOTYPE</span></div></div>
      <button class="icon" id="closeCommander">×</button>
    </div>
    <div class="brief"><small>LIVE BRIEF</small><p id="commanderBrief"></p></div>
    <div class="quick" id="quickCommands"></div>
    <div class="chat" id="chat"></div>
    <div class="compose"><textarea id="chatInput" placeholder="Ask KZEL about the actual prototype state..."></textarea><button class="primary" id="sendChat">Send</button></div>
  </aside>
</div>

<button class="mobile-fab" id="mobileFab">KZEL</button>
<div class="sim-bar"><div class="sim-inner" id="simControls"></div></div>
<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="tokenModal"><div class="modal"><div class="modal-head"><h2 id="tokenModalTitle"></h2><button class="icon" data-close="tokenModal">×</button></div><div class="modal-body" id="tokenModalBody"></div></div></div>

function qualifiedToday(){return state.candidates.filter(c=>c.status==="QUALIFIED").length}

function openTrades(){return state.shadow.trades.filter(t=>t.status==="OPEN")}
function closedTrades(){return state.shadow.trades.filter(t=>t.status==="CLOSED")}
function tradeProfitDollars(t){return t.qtyValue*(t.returnPct/100)}
function shadowStats(){
 const closed=closedTrades(), wins=closed.filter(t=>t.returnPct>0), losses=closed.filter(t=>t.returnPct<=0);
 const closedPL=closed.reduce((a,t)=>a+tradeProfitDollars(t),0);
 const openPL=openTrades().reduce((a,t)=>a+tradeProfitDollars(t),0);
 const grossWin=wins.reduce((a,t)=>a+tradeProfitDollars(t),0);
 const grossLoss=Math.abs(losses.reduce((a,t)=>a+tradeProfitDollars(t),0));
 const balance=state.shadow.startingBalance+closedPL;
 const winRate=closed.length?wins.length/closed.length*100:0;
 const profitFactor=grossLoss?grossWin/grossLoss:grossWin?99:0;
 const mfe=closed.length?closed.reduce((a,t)=>a+t.mfe,0)/closed.length:0;
 const mae=closed.length?closed.reduce((a,t)=>a+t.mae,0)/closed.length:0;
 let peak=state.shadow.startingBalance, bal=state.shadow.startingBalance, maxDD=0;
 closed.forEach(t=>{bal+=tradeProfitDollars(t);peak=Math.max(peak,bal);maxDD=Math.min(maxDD,(bal-peak)/peak*100)});
 return {closedPL,openPL,balance,winRate,profitFactor,mfe,mae,maxDD,closedCount:closed.length};
}
function bestCandidate(){

function funnelCounts(){

 STAGES.forEach(s=>counts[s]=0);
 state.candidates.forEach(c=>{

 });
 counts.REJECTED=state.candidates.filter(c=>c.status==="REJECTED").length;
 return counts;
}

 return 0;
}

 if(tab==="council")return `<div class="card table-wrap"><table class="table"><tr><th>Domain</th><th>Verdict</th></tr>${Object.entries(c.ai).filter(([k])=>!["final","confidence"].includes(k)).map(([k,v])=>`<tr><td>${k}</td><td>${tag(v,statusClass(v))}</td></tr>`).join("")}<tr><td><b>FINAL</b></td><td>${tag(c.ai.final,statusClass(c.ai.final))} ${c.ai.confidence}%</td></tr></table></div>`;
 if(tab==="decision")return `<div class="card"><h3>DECISION HISTORY</h3><div class="timeline">${c.timeline.map(e=>`<div class="event"><time>${e[0]}</time><i></i><p><b>${e[1]}</b><br>${e[2]}</p></div>`).join("")}</div></div>`;

function advanceCandidate(){
 if(state.services.DEX.status==="RATE_LIMITED"){
  state.services.DEX.cooldown=Math.max(20,state.services.DEX.cooldown||45);addAudit("DEX_RATE_LIMIT","Candidate processing deferred by global DEX cooldown");save();render();toast("DEX rate limited — candidate deferred");return;
 }
 const c=state.candidates.find(c=>c.status==="ACTIVE" || (c.status==="QUALIFIED" && ["QUALIFIED","PUSHOVER"].includes(c.stage)));
 if(!c){toast("No ACTIVE candidate to advance");return}
 processCandidateOneStage(c);save();render();
}
function processCandidateOneStage(c){
 let idx=STAGES.indexOf(c.stage); if(idx<0)return;
 if(c.stage==="MARKET"&&c.liquidity<15000){rejectCandidate(c,"Insufficient executable liquidity");return}
 if(c.stage==="SECURITY"){
  c.security={sellable:true,contract:"SAFE",liquidityControl:"ACCEPTABLE",mintAuthority:"REVOKED",freezeAuthority:"REVOKED",top10:24,largest:7.2,warning:"CAUTION",warnings:["Very young token; limited history"]};c.safety=86;c.evidence=82;c.whaleRisk="LOW";
 }
 if(c.stage==="WALLETS"){c.wallet={clusterRisk:"LOW",largestCluster:9,creatorLinked:3,confidence:"MODERATE",notes:["No economically severe related-wallet cluster detected"]};c.bundleRisk="LOW"}
 if(c.stage==="SOCIAL"){c.social=Math.max(c.social,68);c.narrative=Math.max(c.narrative,70)}
 if(c.stage==="ENTRY"){
  if(c.entry<60||c.remaining<45){c.status="WATCH";c.ai.Entry="WATCH";c.ai.final="WATCH";c.decisionReason="Token is acceptable, but entry is too late / remaining opportunity is weak.";addAudit("ENTRY_WATCH",`${c.name} held as WATCH for entry quality`);return}
  c.ai.Entry="APPROVE";
 }
 if(c.stage==="AI_COUNCIL"){
  c.ai.Market="APPROVE";c.ai.Security=c.safety>=75?"APPROVE":"CAUTION";c.ai.Wallet=c.wallet.clusterRisk==="LOW"?"APPROVE":"CAUTION";c.ai.Social=c.social>=60?"APPROVE":"CAUTION";c.ai.Risk=c.security.warning==="CRITICAL"?"REJECT":"CAUTION";
  if(c.security.warning==="CRITICAL"){rejectCandidate(c,"Critical security condition");return}
  c.ai.final=c.opportunity>=75&&c.entry>=70?"PROMISING":"WATCH";c.ai.confidence=c.ai.final==="PROMISING"?76:64;
 }
 if(c.stage==="QUALIFIED"){
  // Already qualified; move to Pushover
 }
 const next=STAGES[idx+1];
 if(!next)return;
 c.stage=next;c.timeline.push([nowTime(),next,`Prototype progressed to ${STAGE_LABEL[next]}`]);addAudit("STAGE_CHANGE",`${c.name} → ${STAGE_LABEL[next]}`);
 if(next==="QUALIFIED"){
  if(c.ai.final==="PROMISING"||c.ai.final==="STRONG"){
   c.status="QUALIFIED";c.decisionReason="Market, security, entry and final AI evidence are sufficient for a simulated actionable alert.";
  }else{c.status="WATCH";c.stage="ENTRY";return}
 }
 if(next==="PUSHOVER"){
  const existing=state.alerts.find(a=>a.tokenId===c.id&&a.status==="SENT");
  if(existing){state.alerts.push({id:uuid("a"),tokenId:c.id,type:"FULL",status:"DUPLICATE_BLOCKED",time:nowTime(),reason:"Duplicate token notification suppressed"});addAudit("DUPLICATE_BLOCKED",`${c.name} duplicate notification blocked`)}
  else if(state.services.Pushover.status==="OFFLINE"){state.alerts.push({id:uuid("a"),tokenId:c.id,type:"FULL",status:"FAILED",time:nowTime(),reason:"Pushover service offline"});addAudit("PUSHOVER_FAILED",`${c.name} simulated delivery failed`)}
  else{state.alerts.push({id:uuid("a"),tokenId:c.id,type:"FULL",status:"SENT",time:nowTime(),reason:`Qualified ${c.ai.final} ${c.ai.confidence}%`});addAudit("ALERT_SENT",`${c.name} simulated Pushover sent`)}
 }
 if(next==="SHADOW")openShadowTradeFor(c);
}
function rejectCandidate(c,reason){
 c.status="REJECTED";c.decisionReason=reason;c.ai.final="REJECT";c.ai.confidence=95;c.timeline.push([nowTime(),"REJECTED",reason]);addAudit("REJECTED",`${c.name}: ${reason}`);
}
function openShadowTradeFor(c){
 if(!c.price||!c.liquidity){addAudit("SHADOW_INVALID",`${c.name} excluded from valid Shadow trades`);return}
 if(state.shadow.trades.some(t=>t.tokenId===c.id&&t.status==="OPEN"))return;
 state.shadow.trades.unshift({id:uuid("s"),tokenId:c.id,status:"OPEN",entryPrice:c.price,currentPrice:c.price,qtyValue:50,entryTime:nowTime(),exitPrice:null,exitTime:null,mfe:0,mae:0,returnPct:0,pricePath:[1],postmortem:null});

}

function shadowTick(){
 openTrades().forEach(t=>{
  const c=getCandidate(t.tokenId);const bias=c&&c.entry>=80?.035:-.01;const delta=bias+(Math.random()-.48)*.12;
  const next=Math.max(.2,t.pricePath[t.pricePath.length-1]*(1+delta));t.pricePath.push(next);t.currentPrice=t.entryPrice*next;t.returnPct=(next-1)*100;t.mfe=Math.max(t.mfe,t.returnPct);t.mae=Math.min(t.mae,t.returnPct);
  if(t.returnPct>=70||t.returnPct<=-28||t.pricePath.length>=12){closeShadowTrade(t)}
 });
 save();render();
}
function closeShadowTrade(t){
 t.status="CLOSED";t.exitPrice=t.currentPrice;t.exitTime=nowTime();
 const good=t.returnPct>0;
 t.postmortem=good?{worked:["Entry evidence was strong enough before the move","Momentum persisted after entry"],failed:t.mae<-10?["Trade experienced meaningful adverse excursion"]:[],test:"Compare this setup with similar qualified and rejected controls."}:{worked:["Core tradeability was valid"],failed:["Entry/momentum failed after qualification","Downside exceeded expected short-term tolerance"],test:"Review whether entry-quality or authenticity signals could identify this pattern earlier."};
 addAudit("SHADOW_CLOSED",`${getCandidate(t.tokenId)?.name||t.tokenId} closed ${pct(t.returnPct)}`);
 const mem={id:uuid("m"),type:"HYPOTHESIS",title:`Shadow outcome: ${getCandidate(t.tokenId)?.name||t.tokenId}`,body:`Paper trade closed ${pct(t.returnPct)}. ${t.postmortem.test}`,confidence:.5,status:"EXPERIMENTAL",created:new Date().toISOString().slice(0,10),evidence:[`Shadow trade ${t.id}`],tokenIds:[t.tokenId]};
 state.memories.unshift(mem);
}

}
function openCaptureForm(){
 openForm("Quick Capture",`<div class="field"><label>Type</label><select id="cType"><option>TOKEN</option><option>BUG</option><option>OBSERVATION</option><option>IDEA</option><option>MISSED_OPPORTUNITY</option></select></div><div class="field" style="margin-top:8px"><label>Contract / reference</label><input id="cRef"></div><div class="field" style="margin-top:8px"><label>Note</label><textarea id="cNote"></textarea></div><div class="field" style="margin-top:8px"><label>Screenshot / file (local prototype metadata only)</label><input id="cFile" type="file"></div><button class="primary" id="saveCapture" style="margin-top:9px">Capture</button>`,()=>{document.getElementById("saveCapture").onclick=()=>{const file=document.getElementById("cFile").files[0];const cap={id:uuid("cap"),type:document.getElementById("cType").value,reference:document.getElementById("cRef").value.trim(),note:document.getElementById("cNote").value.trim(),file:file?file.name:null,created:new Date().toLocaleString()};state.captures.unshift(cap);if(cap.type==="MISSED_OPPORTUNITY"){state.investigations.unshift({id:uuid("i"),contract:cap.reference||"manual capture",tokenId:null,status:"OPEN",classification:"UNDER_REVIEW",summary:cap.note||"Quick-captured missed opportunity",created:cap.created})}save();closeForm();toast("Capture saved")}})
}
function openForm(title,html,bind){document.getElementById("formTitle").textContent=title;document.getElementById("formBody").innerHTML=html;document.getElementById("formModal").classList.add("open");setTimeout(bind,0)}
function closeForm(){document.getElementById("formModal").classList.remove("open")}
function openConfirm(title,text,action){openForm(title,`<p class="note" style="font-size:11px">${text}</p><div class="btn-row"><button class="btn bad" id="confirmYes">Confirm</button><button class="btn" id="confirmNo">Cancel</button></div>`,()=>{document.getElementById("confirmYes").onclick=()=>{closeForm();action()};document.getElementById("confirmNo").onclick=closeForm})}

function sendCommander(q){
 state.conversation.push({role:"user",text:q,tools:[]});
 const response=commanderRespond(q);
 state.conversation.push({role:"assistant",text:response.text,tools:response.tools});
 state.conversation=state.conversation.slice(-60);save();renderChat();renderCommanderBrief();
 if(response.action)response.action();
}
function commanderRespond(q){
 const text=q.trim(), low=text.toLowerCase(), tools=[];
 const current=state.currentTokenId?getCandidate(state.currentTokenId):null;
 const contractMatch=text.match(/0x[a-fA-F0-9]{10,}|[1-9A-HJ-NP-Za-km-z]{30,}/);
 let c=contractMatch?state.candidates.find(x=>x.contract.toLowerCase()===contractMatch[0].toLowerCase()):null;
 if(!c&&current&&(low.includes("this")||low.includes("it")||low.includes("token")))c=current;
 if(low.includes("remember that")||low.startsWith("remember ")){
  const memoryText=text.replace(/^remember( that)?/i,"").trim();tools.push("CREATE_MEMORY");
  return {text:`I identified that as a durable instruction. I stored it in Second Brain as a USER_INSTRUCTION: “${memoryText}”`,tools,action:()=>{state.memories.unshift({id:uuid("m"),type:"USER_INSTRUCTION",title:memoryText.slice(0,70),body:memoryText,confidence:1,status:"CURRENT",created:new Date().toISOString().slice(0,10),evidence:["Commander chat"],tokenIds:c?[c.id]:[]});save();render()}};
 }
 if(low.includes("what have i told")||low.includes("what did i tell")||low.includes("shadow trader eligibility")){
  tools.push("SEARCH_MEMORY");const mem=state.memories.filter(m=>m.type==="USER_INSTRUCTION"||m.body.toLowerCase().includes("shadow"));
  return {text:mem.length?mem.map(m=>`${m.title}: ${m.body}`).join(" | "):"I found no matching durable instruction in Second Brain.",tools};
 }
 if(low.includes("create a task")||low.includes("make this a task")){
  tools.push("CREATE_TASK");const title=text.replace(/create a task( to)?/i,"").trim()||"Commander-created investigation";
  return {text:`Created task: “${title}”. I assigned it to Shadow & Learning by default; you can edit priority, agent, goal and evidence in Goals & Tasks.`,tools,action:()=>{state.tasks.unshift({id:uuid("t"),title,status:"TODO",priority:"MEDIUM",agent:"Shadow & Learning",tokenId:c?.id||state.currentTokenId||null,goalId:null,evidence:["Commander chat"],result:""});save();render()}};
 }
 if(low.includes("add this as a goal")||low.includes("make this a goal")||low.startsWith("create a goal")){
  tools.push("CREATE_GOAL");const title=text.replace(/(add this as a goal|make this a goal|create a goal)/i,"").trim()||"Commander-created goal";
  return {text:`Created goal: “${title}”. It is now visible in Goals & Tasks.`,tools,action:()=>{state.goals.push({id:uuid("g"),name:title,target:"Manual target",metric:"manual",targetValue:100,status:"NEW",description:"Created through Commander chat."});save();render()}};
 }
 if(low.includes("system health")||low.includes("rate limit")||low.includes("dex problem")){
  tools.push("GET_SYSTEM_HEALTH");const bad=Object.entries(state.services).filter(([_,s])=>s.status!=="HEALTHY");
  return {text:bad.length?`System is ${serviceOverall()}. Current issues: ${bad.map(([n,s])=>`${n} ${s.status}${s.cooldown?` (${s.cooldown}s cooldown)`:""}`).join(", ")}.`:`System health is HEALTHY. No service is currently degraded, rate limited or offline. DEX latency is ${state.services.DEX.latency}ms and the cooldown is ${state.services.DEX.cooldown}s.`,tools};
 }
 if(low.includes("why")&&low.includes("no alert")){
  tools.push("GET_TODAY_SUMMARY","GET_FUNNEL","GET_SYSTEM_HEALTH");const active=state.candidates.filter(c=>["ACTIVE","WATCH"].includes(c.status));const reasons=active.map(c=>`${c.name}: ${c.decisionReason}`).join(" | ");
  return {text:`You have ${qualifiedToday()} qualified candidate(s) and ${notificationSent()} simulated sent alert(s). Candidates not alerted are currently blocked mainly by: ${reasons||"no active candidates"}. Infrastructure is ${serviceOverall()}.`,tools};
 }
 if(low.includes("best")&&low.includes("opportun")){
  tools.push("LIST_ACTIVE_CANDIDATES");const b=bestCandidate();return {text:b?`${b.name} is currently strongest: Opportunity ${b.opportunity}, Entry ${b.entry}, Safety ${b.safety||"pending"}, Evidence ${b.evidence||"pending"}, Remaining ${b.remaining}. Biggest current risk: ${b.security.warnings[0]||"no major recorded warning"}.`:"There is no active opportunity.",tools};
 }
 if(low.includes("open shadow")||low.includes("shadow trade")){
  tools.push("GET_SHADOW_TRADES");return {text:openTrades().length?openTrades().map(t=>{const tc=getCandidate(t.tokenId);return `${tc?.name||t.tokenId}: ${pct(t.returnPct)} paper return, MFE ${pct(t.mfe)}, MAE ${pct(t.mae)}.`}).join(" | "):"There are no open Shadow trades.",tools};
 }
 if(low.includes("what")&&low.includes("learn")){
  tools.push("SEARCH_MEMORY");const mem=state.memories.filter(m=>["VALIDATED_LESSON","DECISION"].includes(m.type)).slice(0,4);return {text:mem.map(m=>`${m.title}: ${m.body}`).join(" | "),tools};
 }
 if(low.includes("daily review")){tools.push("GET_DAILY_REVIEW");return {text:generateDailyReview().sections.map(s=>`${s.title}: ${s.text}`).join(" | "),tools}}
 if(low.includes("weekly review")){tools.push("GET_WEEKLY_REVIEW");return {text:generateWeeklyReview().sections.map(s=>`${s.title}: ${s.text}`).join(" | "),tools}}
 if(low.includes("bottleneck")){tools.push("GET_FUNNEL","GET_SYSTEM_HEALTH");const sec=state.candidates.filter(c=>c.stage==="SECURITY").length;return {text:state.services.DEX.status==="RATE_LIMITED"?`The largest active bottleneck is DEX rate limiting. Cooldown is ${state.services.DEX.cooldown}s, so market-stage candidates are deferred without consuming token attempts.`:`The largest current candidate-stage bottleneck is ${sec?"Security evidence":"Market/entry qualification"}. ${sec} candidate(s) are currently in Security.`,tools}}
 if(low.includes("investigate")&&c){tools.push("GET_CANDIDATE","GET_SECURITY_RESULT","ROUTE_AGENTS");return {text:`I found ${c.name}. Current status ${c.status}, stage ${STAGE_LABEL[c.stage]}. ${c.decisionReason} I am routing Market & Entry, Security & Wallet and Risk Challenger for a prototype investigation.`,tools,action:()=>routeInvestigation(c.id)}}
 if(low.includes("why")&&c){tools.push("GET_CANDIDATE","GET_SECURITY_RESULT");return {text:`${c.name}: ${c.decisionReason} Security severity is ${c.security.warning}; entry ${c.entry}/100; remaining opportunity ${c.remaining}/100; AI final ${c.ai.final} ${c.ai.confidence}%.`,tools}}
 if(low.includes("compare")&&c){tools.push("GET_CANDIDATE","LIST_ACTIVE_CANDIDATES");const b=bestCandidate();return {text:`${c.name} vs ${b.name}: opportunity ${c.opportunity} vs ${b.opportunity}; entry ${c.entry} vs ${b.entry}; safety ${c.safety||"pending"} vs ${b.safety||"pending"}; remaining ${c.remaining} vs ${b.remaining}.`,tools}}
 if(contractMatch&&!c){tools.push("GET_CANDIDATE","CREATE_INVESTIGATION");return {text:`That contract is not in the prototype candidate store. I would treat it as an investigation / possible discovery miss. I can add it to Missed Opportunities.`,tools}}
 if(low.includes("today")||low.includes("status")){tools.push("GET_TODAY_SUMMARY");const st=shadowStats();return {text:`Today: ${qualifiedToday()} qualified, ${activeCandidates()} active/watch, ${notificationSent()} simulated alerts sent, ${openTrades().length} open Shadow trades, closed paper P/L ${st.closedPL>=0?"+":""}$${st.closedPL.toFixed(2)}, system ${serviceOverall()}.`,tools}}
 return {text:`I couldn't map that to a specific prototype tool yet. I can query candidates, funnel, security, Shadow trades, alerts, goals, tasks, memory, reviews and system health. If you're viewing a token, ask “why is this risky?” or “compare it with the strongest candidate.”`,tools:["INTENT_ROUTER"]};
}

function renderSimControls(){
 const el=document.getElementById("simControls");
 const items=[["toggleSim",state.simRunning?"Pause simulation":"Run simulation"],["normal","Normal day"],["zero","Zero-alert"],["dex","DEX incident"],["strong","Strong opportunity"],["securityFail","Security failure"],["shadowReview","Shadow review"]];
 el.innerHTML=items.map(([id,label])=>`<button data-sim="${id}" class="${(id==="toggleSim"&&state.simRunning)||scenarioButtonActive(id)?"active":""}">${label}</button>`).join("");
 el.querySelectorAll("button").forEach(b=>b.onclick=()=>handleSim(b.dataset.sim));
}
function scenarioButtonActive(id){return ({normal:"NORMAL_ACTIVE_DAY",zero:"ZERO_ALERT_PROBLEM",dex:"DEX_RATE_LIMIT",strong:"STRONG_OPPORTUNITY_DAY",securityFail:"SECURITY_FAILURE",shadowReview:"SHADOW_TRADER_REVIEW"}[id]===state.scenario)}
function handleSim(id){
 if(id==="toggleSim"){state.simRunning=!state.simRunning;state.simRunning?startSimulation():stopSimulation();save();renderSimControls();toast(state.simRunning?"Simulation running":"Simulation paused");return}
 const map={normal:"NORMAL_ACTIVE_DAY",zero:"ZERO_ALERT_PROBLEM",dex:"DEX_RATE_LIMIT",strong:"STRONG_OPPORTUNITY_DAY",securityFail:"SECURITY_FAILURE",shadowReview:"SHADOW_TRADER_REVIEW"};
 applyScenario(map[id]);save();render();toast(`Scenario: ${state.scenario.replaceAll("_"," ")}`);
}
function applyScenario(sc){
 state.scenario=sc;
 if(sc==="NORMAL_ACTIVE_DAY"){state.services.DEX.status="HEALTHY";state.services.DEX.cooldown=0;state.services.Pushover.status="HEALTHY"}
 if(sc==="ZERO_ALERT_PROBLEM"){state.candidates.forEach(c=>{if(c.status==="ACTIVE")c.entry=Math.min(c.entry,55)});state.services.DEX.status="HEALTHY"}
 if(sc==="DEX_RATE_LIMIT"){state.services.DEX.status="RATE_LIMITED";state.services.DEX.cooldown=75;state.services.DEX.errors+=1}
 if(sc==="STRONG_OPPORTUNITY_DAY"){injectCandidate();const c=state.candidates[0];c.opportunity=92;c.entry=94;c.remaining=95;c.buys5m=18;c.sells5m=4;c.volume5m=7600}
 if(sc==="SECURITY_FAILURE"){injectCandidate();const c=state.candidates[0];c.stage="SECURITY";c.security={sellable:false,contract:"DANGEROUS",liquidityControl:"CREATOR_CONTROLLED",mintAuthority:"ACTIVE",freezeAuthority:"ACTIVE",top10:78,largest:41,warning:"CRITICAL",warnings:["Unable to sell reliably","Active dangerous authority","Creator-linked concentration severe"]};c.safety=12;c.evidence=94}
 if(sc==="SHADOW_TRADER_REVIEW"){state.activeView="shadow"}
 addAudit("SCENARIO",`Demo scenario changed to ${sc}`);
}
function startSimulation(){stopSimulation(false);simTimer=setInterval(simStep,2200)}
function stopSimulation(setFalse=true){if(simTimer){clearInterval(simTimer);simTimer=null}if(setFalse)state.simRunning=false}
function simStep(){
 state.simTick++;
 Object.values(state.services).forEach(s=>{if(s.cooldown>0){s.cooldown=Math.max(0,s.cooldown-5);if(s.cooldown===0&&s.status==="RATE_LIMITED")s.status="HEALTHY"}});
 const act=state.candidates.find(c=>c.status==="ACTIVE" || (c.status==="QUALIFIED" && ["QUALIFIED","PUSHOVER"].includes(c.stage)));
 if(act)processCandidateOneStage(act); else if(state.simTick%3===0)injectCandidate();
 shadowTickSilent();
 save();render();
}
function shadowTickSilent(){
 openTrades().forEach(t=>{const c=getCandidate(t.tokenId);const bias=c&&c.entry>=80?.025:-.005;const delta=bias+(Math.random()-.48)*.09;const next=Math.max(.2,t.pricePath[t.pricePath.length-1]*(1+delta));t.pricePath.push(next);t.currentPrice=t.entryPrice*next;t.returnPct=(next-1)*100;t.mfe=Math.max(t.mfe,t.returnPct);t.mae=Math.min(t.mae,t.returnPct);if(t.returnPct>=70||t.returnPct<=-28||t.pricePath.length>=12)closeShadowTrade(t)})
}

bindGlobal();render();
if(state.simRunning)startSimulation();
</script>
