/* ===== KZEL VISUAL POLISH v5.1 =====
   Root-cause fixes + purposeful motion. Shared selectors are deliberately
   scoped so event types cannot inherit full agent-card styling. */
:root{--motion-fast:160ms;--motion-med:280ms;--motion-slow:700ms;--ease-kzel:cubic-bezier(.2,.8,.2,1)}

/* ROOT-CAUSE FIX 1: live-event type "agent" collided with the legacy .agent card class.
   Hard-reset event markers so they remain 6px status dots on every page/device. */
.event-row .event-dot{display:block!important;box-sizing:border-box!important;width:6px!important;height:6px!important;min-width:6px!important;min-height:6px!important;max-width:6px!important;max-height:6px!important;padding:0!important;margin:0!important;border:0!important;border-radius:50%!important;box-shadow:none!important;position:relative!important;inset:auto!important;transform:none!important;overflow:visible!important}
.event-row .event-dot.agent{background:var(--blue)!important;animation:kzelDotPulse 1.8s ease-in-out infinite}
.event-row .event-dot.evidence,.event-row .event-dot.pipeline{animation:kzelEvidencePulse 2.2s ease-in-out infinite}
@keyframes kzelDotPulse{0%,100%{box-shadow:0 0 0 0 rgba(102,167,255,.28)!important}50%{box-shadow:0 0 0 4px rgba(102,167,255,0)!important}}
@keyframes kzelEvidencePulse{0%,100%{opacity:.72}50%{opacity:1}}

/* ROOT-CAUSE FIX 2: flexbox stretched the WORKING status tag to the height of long headings. */
.investigation-head{align-items:flex-start!important}
.investigation-head>.tag{align-self:flex-start!important;flex:0 0 auto!important;white-space:nowrap!important;min-height:0!important;height:auto!important;line-height:1.2!important}

/* Empty legacy token circles now carry a deliberate neutral identity mark. */
.coin{display:grid!important;place-items:center!important;overflow:hidden!important;background:linear-gradient(145deg,#151a20,#090c0f)!important;border-color:#39434f!important}
.coin:after{content:"◇";font-size:12px;line-height:1;color:#9aa6b3;font-weight:700}

/* Guard against accidental rounded/circular inheritance on inline status text. */
.event-source,.event-row b,.work-row b,.work-row span,.investigation-head h3{border-radius:0!important;background:transparent!important;box-shadow:none!important}

/* Premium interaction language */
button,.btn,.ghost,.primary,.token-card,.card,.inbox-item,.division-agent,.stage{transition:transform var(--motion-fast) var(--ease-kzel),border-color var(--motion-fast) ease,background-color var(--motion-fast) ease,box-shadow var(--motion-med) ease,opacity var(--motion-fast) ease}
button:active,.btn:active,.ghost:active,.primary:active{transform:scale(.975)}
@media(hover:hover){.card:hover{border-color:#2b3440}.inbox-item:hover,.token-card:hover{transform:translateY(-2px);border-color:#3a4654;box-shadow:0 14px 38px rgba(0,0,0,.22)}.nav button:hover{transform:translateX(2px)}}

/* Subtle ambient command-grid — intentionally non-interactive. */
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 72%)}
.shell,.mobile-fab,.sim-bar,.toast,.modal-backdrop{position:relative;z-index:1}.mobile-fab,.sim-bar,.toast,.modal-backdrop{position:fixed}

/* LIVE SCANNER: state-driven, restrained motion. */
.stage.hot{animation:kzelStageWorking 2.4s ease-in-out infinite}
.stage.hot:before{content:"";position:absolute;left:12%;right:12%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(102,167,255,.9),transparent);animation:kzelScanLine 1.9s linear infinite}
.stage.degraded{animation:kzelWarnBreath 2.6s ease-in-out infinite}
.stage::after{background:linear-gradient(90deg,#39414b,#5d6c7e,#39414b);background-size:200% 100%;animation:kzelFlow 2.6s linear infinite}
@keyframes kzelStageWorking{0%,100%{box-shadow:0 0 0 1px rgba(102,167,255,.03),0 0 16px rgba(102,167,255,.02)}50%{box-shadow:0 0 0 1px rgba(102,167,255,.16),0 0 24px rgba(102,167,255,.07)}}
@keyframes kzelScanLine{from{transform:translateX(-18%);opacity:.2}50%{opacity:1}to{transform:translateX(18%);opacity:.2}}
@keyframes kzelWarnBreath{50%{border-color:#a57a36;box-shadow:0 0 18px rgba(244,180,77,.08)}}
@keyframes kzelFlow{to{background-position:-200% 0}}

/* Event stream: new operational evidence is readable first, animated second. */
.event-row{transition:background-color var(--motion-fast) ease,border-color var(--motion-fast) ease}
.event-row:hover{background:#0b1015}
.event-row:first-child{animation:kzelEventIn .32s var(--ease-kzel) both}
@keyframes kzelEventIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* AI Operations: active specialists feel alive; idle specialists stay calm. */
.division-agent.working{overflow:hidden;animation:kzelAgentBreath 2.8s ease-in-out infinite}
.division-agent.working:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 25%,rgba(102,167,255,.07) 45%,transparent 65%);transform:translateX(-120%);animation:kzelAgentSweep 3.2s ease-in-out infinite}
.commander-core.working{animation:kzelCommanderPulse 2.7s ease-in-out infinite}
@keyframes kzelAgentBreath{50%{border-color:#6689ae;box-shadow:0 0 30px rgba(102,167,255,.11)}}
@keyframes kzelAgentSweep{55%,100%{transform:translateX(120%)}}
@keyframes kzelCommanderPulse{50%{box-shadow:0 0 0 1px rgba(102,167,255,.32),0 0 72px rgba(102,167,255,.14)}}

/* Handoffs: keep the moving evidence particle small and bounded. */
.handoff-line{overflow:visible}.handoff-line:after{width:4px!important;height:4px!important;padding:0!important;border:0!important;border-radius:50%!important;box-shadow:0 0 8px rgba(168,199,255,.45)}

/* Second Brain: selected/retrieved memories can glow without losing labels. */
.brain-node circle{transform-box:fill-box;transform-origin:center;transition:stroke-width .22s ease,fill .22s ease,opacity .22s ease}
.brain-node:hover circle{filter:url(#brainGlow);stroke-width:.7}
.brain-link{stroke-dasharray:.7 1.4;animation:kzelMemoryFlow 8s linear infinite}
@keyframes kzelMemoryFlow{to{stroke-dashoffset:-14}}

/* Reports, Inbox and Reviews: meaningful arrival/completion motion. */
.report-card:first-child,.inbox-item:first-child{animation:kzelReportIn .34s var(--ease-kzel) both}
@keyframes kzelReportIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.progress span{transition:width .65s var(--ease-kzel),background-color .25s ease}
.story-flow i{animation:kzelStoryArrow 2.2s ease-in-out infinite}
@keyframes kzelStoryArrow{50%{transform:translateX(3px);opacity:1}0%,100%{opacity:.45}}

/* Health: state animation communicates impact without flashing. */
.health-node.degraded,.health-node.rate_limited{animation:kzelHealthWarn 2.8s ease-in-out infinite}
.health-node.offline{animation:kzelHealthCritical 1.8s ease-in-out infinite}
.health-map>svg line{stroke-dasharray:2 3;animation:kzelInfraFlow 6s linear infinite}
@keyframes kzelInfraFlow{to{stroke-dashoffset:-18}}
@keyframes kzelHealthWarn{50%{box-shadow:0 0 18px rgba(244,180,77,.08)}}
@keyframes kzelHealthCritical{50%{border-color:#b7545a;box-shadow:0 0 20px rgba(255,109,114,.09)}}

/* Modal / search / Commander panels */
.modal-backdrop.open{animation:kzelBackdrop .18s ease both}.modal-backdrop.open .modal{animation:kzelModalIn .24s var(--ease-kzel) both}
.search-results.open{animation:kzelDropIn .18s var(--ease-kzel) both}
.commander.open{animation:kzelCommanderIn .22s var(--ease-kzel) both}
@keyframes kzelBackdrop{from{opacity:0}to{opacity:1}}
@keyframes kzelModalIn{from{opacity:0;transform:translateY(8px) scale(.992)}to{opacity:1;transform:none}}
@keyframes kzelDropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes kzelCommanderIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

/* Mobile polish: prevent demo controls and Commander FAB from colliding with content. */
@media(max-width:780px){
 body:before{opacity:.08;background-size:48px 48px}
 .content{padding-bottom:168px!important}
 .sim-bar{left:10px!important;right:92px!important;bottom:calc(14px + env(safe-area-inset-bottom))!important;max-width:calc(100vw - 102px)}
 .sim-inner{max-width:100%!important;overflow-x:auto!important;overscroll-behavior-x:contain;scrollbar-width:none}
 .sim-inner::-webkit-scrollbar{display:none}
 .sim-inner button{min-height:42px;padding:7px 12px;white-space:nowrap}
 .mobile-fab{right:14px!important;bottom:calc(14px + env(safe-area-inset-bottom))!important;width:64px;height:64px}
 .event-row{grid-template-columns:50px 68px 8px minmax(0,1fr)!important;padding:9px 10px!important}

 .investigation-head{gap:8px}.investigation-head>.tag{font-size:7px;padding:4px 7px}

/* Prototype scenario controls are debugging utilities, not primary mobile controls.
   Keep them accessible without covering live operational content. */
@media(max-width:780px){
 .sim-bar{position:static!important;left:auto!important;right:auto!important;bottom:auto!important;max-width:none!important;margin:0 12px 18px;padding:0;display:block}
 .sim-inner{width:100%;border-radius:14px;justify-content:flex-start;padding:7px;background:#0b0f13}
 .content{padding-bottom:108px!important}
}

/* Accessibility + battery/performance safety. */
@media(prefers-reduced-motion:reduce){
 .stage.hot,.stage.degraded,.division-agent.working,.commander-core.working,.event-row:first-child,.report-card:first-child,.inbox-item:first-child,.health-node,.brain-link,.story-flow i,.event-row .event-dot,.stage:before,.stage:after,.division-agent:before{animation:none!important}
}

function money(n){if(n==null)return"—";if(n>=1e6)return"$"+(n/1e6).toFixed(2)+"M";if(n>=1e3)return"$"+(n/1e3).toFixed(1)+"K";return"$"+Number(n).toFixed(0)}
function pct(n){return (n>=0?"+":"")+Number(n).toFixed(1)+"%"}

function uuid(prefix){return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)}

function serviceOverall(){
 const vals=Object.values(state.services).map(s=>s.status);
 if(vals.includes("OFFLINE"))return"ISSUE";
 if(vals.includes("RATE_LIMITED")||vals.includes("DEGRADED"))return"DEGRADED";
 return"HEALTHY";
}
function qualifiedToday(){return state.candidates.filter(c=>c.status==="QUALIFIED").length}
function activeCandidates(){return state.candidates.filter(c=>["ACTIVE","WATCH"].includes(c.status)).length}
function notificationSent(){return state.alerts.filter(a=>a.status==="SENT").length}
function openTrades(){return state.shadow.trades.filter(t=>t.status==="OPEN")}
function closedTrades(){return state.shadow.trades.filter(t=>t.status==="CLOSED")}
function tradeProfitDollars(t){return t.qtyValue*(t.returnPct/100)}
function shadowStats(){
 const closed=closedTrades(), wins=closed.filter(t=>t.returnPct>0), losses=closed.filter(t=>t.returnPct<=0);
 const closedPL=closed.reduce((a,t)=>a+tradeProfitDollars(t),0);
 const openPL=openTrades().reduce((a,t)=>a+tradeProfitDollars(t),0);
 const grossWin=wins.reduce((a,t)=>a+tradeProfitDollars(t),0);
 const grossLoss=Math.abs(losses.reduce((a,t)=>a+tradeProfitDollars(t),0));
 const balance=state.shadow.startingBalance+closedPL;
 const winRate=closed.length?wins.length/closed.length*100:0;
 const profitFactor=grossLoss?grossWin/grossLoss:grossWin?99:0;
 const mfe=closed.length?closed.reduce((a,t)=>a+t.mfe,0)/closed.length:0;
 const mae=closed.length?closed.reduce((a,t)=>a+t.mae,0)/closed.length:0;
 let peak=state.shadow.startingBalance, bal=state.shadow.startingBalance, maxDD=0;
 closed.forEach(t=>{bal+=tradeProfitDollars(t);peak=Math.max(peak,bal);maxDD=Math.min(maxDD,(bal-peak)/peak*100)});
 return {closedPL,openPL,balance,winRate,profitFactor,mfe,mae,maxDD,closedCount:closed.length};
}
function bestCandidate(){
 return [...state.candidates].filter(c=>c.status!=="REJECTED").sort((a,b)=>b.opportunity-a.opportunity)[0]||null;
}
function funnelCounts(){
 const counts={};
 STAGES.forEach(s=>counts[s]=0);
 state.candidates.forEach(c=>{
  const idx=STAGES.indexOf(c.stage);
  if(idx>=0){for(let i=0;i<=idx;i++)counts[STAGES[i]]++}
 });
 counts.REJECTED=state.candidates.filter(c=>c.status==="REJECTED").length;
 return counts;
}
function goalProgress(g){
 if(g.metric==="qualifiedToday")return Math.min(100,qualifiedToday()/g.targetValue*100);
 if(g.metric==="latency"){const synthetic=state.scenario==="DEX_RATE_LIMIT"?28:14;return Math.min(100,g.targetValue/synthetic*100)}
 if(g.metric==="invalidRate"){const q=Math.max(1,qualifiedToday()+state.alerts.filter(a=>a.status==="BLOCKED").length);const invalid=state.candidates.filter(c=>c.status==="REJECTED"&&c.stage==="QUALIFIED").length;const rate=invalid/q*100;return Math.max(0,100-rate/g.targetValue*100)}
 if(g.metric==="shadowSamples")return Math.min(100,closedTrades().length/g.targetValue*100);
 return 0;
}

function chartSvg(path,positive){
 const pts=path.map((v,i)=>[i/(path.length-1)*100,90-(Math.max(.4,Math.min(4,v))-.4)/3.6*80]);
 return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${positive?"#47dc87":"#ff6d72"}" stroke-width="1.7" vector-effect="non-scaling-stroke"/><line x1="0" y1="90" x2="100" y2="90" stroke="#333" stroke-width=".4"/></svg>`;
}

function renderSearch(q){

 const results=[];

 state.tasks.filter(t=>t.title.toLowerCase().includes(q)).forEach(t=>results.push({type:"TASK",title:t.title,sub:t.status,action:()=>{state.activeView="goals";render()}}));
 state.memories.filter(m=>`${m.title} ${m.body}`.toLowerCase().includes(q)).forEach(m=>results.push({type:"MEMORY",title:m.title,sub:m.type,action:()=>{state.activeView="memory";render()}}));

function advanceCandidate(){
 if(state.services.DEX.status==="RATE_LIMITED"){
  state.services.DEX.cooldown=Math.max(20,state.services.DEX.cooldown||45);addAudit("DEX_RATE_LIMIT","Candidate processing deferred by global DEX cooldown");save();render();toast("DEX rate limited — candidate deferred");return;
 }
 const c=state.candidates.find(c=>c.status==="ACTIVE" || (c.status==="QUALIFIED" && ["QUALIFIED","PUSHOVER"].includes(c.stage)));
 if(!c){toast("No ACTIVE candidate to advance");return}

}
function processCandidateOneStage(c){
 let idx=STAGES.indexOf(c.stage); if(idx<0)return;
 if(c.stage==="MARKET"&&c.liquidity<15000){rejectCandidate(c,"Insufficient executable liquidity");return}
 if(c.stage==="SECURITY"){
  c.security={sellable:true,contract:"SAFE",liquidityControl:"ACCEPTABLE",mintAuthority:"REVOKED",freezeAuthority:"REVOKED",top10:24,largest:7.2,warning:"CAUTION",warnings:["Very young token; limited history"]};c.safety=86;c.evidence=82;c.whaleRisk="LOW";
 }
 if(c.stage==="WALLETS"){c.wallet={clusterRisk:"LOW",largestCluster:9,creatorLinked:3,confidence:"MODERATE",notes:["No economically severe related-wallet cluster detected"]};c.bundleRisk="LOW"}
 if(c.stage==="SOCIAL"){c.social=Math.max(c.social,68);c.narrative=Math.max(c.narrative,70)}
 if(c.stage==="ENTRY"){
  if(c.entry<60||c.remaining<45){c.status="WATCH";c.ai.Entry="WATCH";c.ai.final="WATCH";c.decisionReason="Token is acceptable, but entry is too late / remaining opportunity is weak.";addAudit("ENTRY_WATCH",`${c.name} held as WATCH for entry quality`);return}
  c.ai.Entry="APPROVE";
 }
 if(c.stage==="AI_COUNCIL"){
  c.ai.Market="APPROVE";c.ai.Security=c.safety>=75?"APPROVE":"CAUTION";c.ai.Wallet=c.wallet.clusterRisk==="LOW"?"APPROVE":"CAUTION";c.ai.Social=c.social>=60?"APPROVE":"CAUTION";c.ai.Risk=c.security.warning==="CRITICAL"?"REJECT":"CAUTION";
  if(c.security.warning==="CRITICAL"){rejectCandidate(c,"Critical security condition");return}
  c.ai.final=c.opportunity>=75&&c.entry>=70?"PROMISING":"WATCH";c.ai.confidence=c.ai.final==="PROMISING"?76:64;
 }
 if(c.stage==="QUALIFIED"){
  // Already qualified; move to Pushover
 }
 const next=STAGES[idx+1];
 if(!next)return;
 c.stage=next;c.timeline.push([nowTime(),next,`Prototype progressed to ${STAGE_LABEL[next]}`]);addAudit("STAGE_CHANGE",`${c.name} → ${STAGE_LABEL[next]}`);
 if(next==="QUALIFIED"){
  if(c.ai.final==="PROMISING"||c.ai.final==="STRONG"){
   c.status="QUALIFIED";c.decisionReason="Market, security, entry and final AI evidence are sufficient for a simulated actionable alert.";
  }else{c.status="WATCH";c.stage="ENTRY";return}
 }
 if(next==="PUSHOVER"){
  const existing=state.alerts.find(a=>a.tokenId===c.id&&a.status==="SENT");
  if(existing){state.alerts.push({id:uuid("a"),tokenId:c.id,type:"FULL",status:"DUPLICATE_BLOCKED",time:nowTime(),reason:"Duplicate token notification suppressed"});addAudit("DUPLICATE_BLOCKED",`${c.name} duplicate notification blocked`)}
  else if(state.services.Pushover.status==="OFFLINE"){state.alerts.push({id:uuid("a"),tokenId:c.id,type:"FULL",status:"FAILED",time:nowTime(),reason:"Pushover service offline"});addAudit("PUSHOVER_FAILED",`${c.name} simulated delivery failed`)}
  else{state.alerts.push({id:uuid("a"),tokenId:c.id,type:"FULL",status:"SENT",time:nowTime(),reason:`Qualified ${c.ai.final} ${c.ai.confidence}%`});addAudit("ALERT_SENT",`${c.name} simulated Pushover sent`)}
 }
 if(next==="SHADOW")openShadowTradeFor(c);
}

function shadowTick(){
 openTrades().forEach(t=>{
  const c=getCandidate(t.tokenId);const bias=c&&c.entry>=80?.035:-.01;const delta=bias+(Math.random()-.48)*.12;
  const next=Math.max(.2,t.pricePath[t.pricePath.length-1]*(1+delta));t.pricePath.push(next);t.currentPrice=t.entryPrice*next;t.returnPct=(next-1)*100;t.mfe=Math.max(t.mfe,t.returnPct);t.mae=Math.min(t.mae,t.returnPct);

}

  if(token||evidence||(thematic&&links.filter(l=>l[0]===i).length<1))links.push([i,j,token?"TOKEN":evidence?"EVIDENCE":"TYPE"]);
 }

}

 const el=document.getElementById("chat");el.innerHTML=state.conversation.map(m=>`<div class="msg ${m.role}"><small>${m.role==='assistant'?'KZEL COMMANDER':'YOU'}</small><p>${escapeHtml(m.text)}</p>${m.entity?renderChatEntity(m.entity):''}${m.tools?.length?`<div class="tool-call">Evidence/tools: ${m.tools.map(escapeHtml).join(' · ')}</div>`:''}</div>`).join("");el.scrollTop=el.scrollHeight;
}
function renderChatEntity(entity){if(entity.type==='INVESTIGATION'){const i=state.investigations.find(x=>x.id===entity.id);return i?`<button class="chat-entity" data-chat-view="investigations">${i.code} · ${escapeHtml(i.objective)} → OPEN INVESTIGATIONS</button>`:''}if(entity.type==='REPORT'){const r=state.reports.find(x=>x.id===entity.id);return r?`<button class="chat-entity" data-chat-view="reports">${escapeHtml(r.title)} → OPEN REPORT</button>`:''}if(entity.type==='TOKEN'){const c=getCandidate(entity.id);return c?`<button class="chat-entity" data-chat-token="${c.id}">${escapeHtml(c.name)} · ${c.opportunity}/100 → OPEN TOKEN</button>`:''}return''}

// Commander intent router upgraded from query-only chatbot to orchestrator.
function commanderRespond(q){
 const text=q.trim(),low=text.toLowerCase(),tools=[];const current=state.currentTokenId?getCandidate(state.currentTokenId):null;const contractMatch=text.match(/0x[a-fA-F0-9]{10,}|[1-9A-HJ-NP-Za-km-z]{30,}/);let c=contractMatch?state.candidates.find(x=>x.contract.toLowerCase()===contractMatch[0].toLowerCase()):null;if(!c&&current&&(low.includes('this')||low.includes('it')||low.includes('token')))c=current;
 if(low.includes('remember that')||low.startsWith('remember ')){const memoryText=text.replace(/^remember( that)?/i,'').trim();tools.push('SECOND_BRAIN.CREATE_DURABLE_MEMORY');return{text:`Understood. I classified that as a durable operating instruction, not ordinary chat. I will store it with full confidence and keep it separate from experimental findings.`,tools,action:()=>{const m={id:uuid('m'),type:'USER_INSTRUCTION',title:memoryText.slice(0,80),body:memoryText,confidence:1,status:'CURRENT',created:new Date().toISOString().slice(0,10),evidence:['Commander instruction'],tokenIds:c?[c.id]:[]};state.memories.unshift(m);addLiveEvent('MEMORY',`Durable instruction stored — ${m.title}`,'SECOND BRAIN',m.id);save();render()},entity:null};}
 if(low.includes('what have i told')||low.includes('what did i tell')){tools.push('SECOND_BRAIN.SEARCH');const terms=low.split(/\s+/).filter(x=>x.length>5&&!['about','what','have','told'].includes(x));const mem=state.memories.filter(m=>m.type==='USER_INSTRUCTION'&&(!terms.length||terms.some(t=>(m.title+' '+m.body).toLowerCase().includes(t))));return{text:mem.length?mem.slice(0,6).map(m=>`${m.title}: ${m.body}`).join(' | '):'I found no matching durable instruction.',tools};}
 if((low.includes('find out why')||low.includes('investigate')||low.includes('diagnose'))&&!c){tools.push('ORCHESTRATOR.PLAN','SECOND_BRAIN.SEARCH','ROUTE_SPECIALISTS','CREATE_INVESTIGATION');const objective=text.replace(/^(please\s+)?(find out why|investigate|diagnose)\s*/i,'').trim()||text;return{text:`I will own this as an investigation. I am checking relevant memory, planning the evidence needed and assigning only the specialists required. You do not need to coordinate them.`,tools,action:()=>{const inv=openCommanderInvestigation(objective,{detectedBy:'USER',priority:'HIGH'});state.conversation[state.conversation.length-1].entity={type:'INVESTIGATION',id:inv.id};save();render();},entity:null};}
 if(c&&(low.includes('investigate')||low.includes('assess')||low.includes('research'))){tools.push('GET_CANDIDATE','ORCHESTRATOR.PLAN','VECTOR','SENTINEL','SIGNAL','REDTEAM');return{text:`I found ${c.name}. I am opening a coordinated token investigation. VECTOR will test trade quality, SENTINEL will test contract/wallet risk, SIGNAL will test authenticity/narrative, and REDTEAM will challenge the combined case.`,tools,action:()=>{const inv=openCommanderInvestigation(`Full token assessment — ${c.name}`,{tokenId:c.id,detectedBy:'USER',priority:'HIGH'});state.conversation[state.conversation.length-1].entity={type:'INVESTIGATION',id:inv.id};save();render();}};}
 if(low.includes('why')&&low.includes('no')&&(low.includes('qualified')||low.includes('alert')||low.includes('token'))){tools.push('GET_FUNNEL','GET_SYSTEM_HEALTH','SECOND_BRAIN.SEARCH','ORCHESTRATOR.PLAN');return{text:`Current state: ${qualifiedToday()} qualified, ${activeCandidates()} active/watch, infrastructure ${serviceOverall()}. I can see enough evidence to open a throughput investigation instead of guessing from one metric. I have delegated funnel/infrastructure analysis to FORGE, market/entry analysis to VECTOR and replay/control analysis to SHADOW.`,tools,action:()=>{const inv=openCommanderInvestigation('Determine why qualified-candidate throughput is below target',{detectedBy:'USER',priority:'HIGH',goalId:state.goals[0]?.id});state.conversation[state.conversation.length-1].entity={type:'INVESTIGATION',id:inv.id};save();render();}};}
 if(low.includes('best')&&low.includes('opportun')){tools.push('LIST_ACTIVE_CANDIDATES','RANK_OPPORTUNITY');const b=bestCandidate();return{text:b?`${b.name} is currently strongest at ${b.opportunity}/100. Entry ${b.entry}, Safety ${b.safety||'pending'}, Remaining ${b.remaining}. ${b.decisionReason}`:'There is no active opportunity.',tools,entity:b?{type:'TOKEN',id:b.id}:null};}
 if(low.includes('system health')||low.includes('rate limit')||low.includes('dex problem')){tools.push('GET_SYSTEM_HEALTH','GET_INCIDENTS');const bad=Object.entries(state.services).filter(([_,s])=>s.status!=='HEALTHY');return{text:bad.length?`System is ${serviceOverall()}. ${bad.map(([n,s])=>`${n} ${s.status}${s.cooldown?` with ${s.cooldown}s cooldown`:''}`).join(', ')}. Commander health monitoring will open/continue incidents automatically.`:`All monitored services are healthy. No autonomous incident currently requires escalation.`,tools};}
 if(low.includes('open shadow')||low.includes('shadow trade')){tools.push('SHADOW.LIST_OPEN');return{text:openTrades().length?openTrades().map(t=>{const tc=getCandidate(t.tokenId);return`${tc?.name||t.tokenId}: ${pct(t.returnPct)} · MFE ${pct(t.mfe)} · MAE ${pct(t.mae)}`}).join(' | '):'No open Shadow trades.',tools};}
 if(low.includes('what')&&low.includes('learn')){tools.push('SECOND_BRAIN.SEARCH');const mem=state.memories.filter(m=>['VALIDATED_LESSON','DECISION'].includes(m.type)).slice(0,5);return{text:mem.length?mem.map(m=>`${m.title}: ${m.body}`).join(' | '):'No validated lesson is available yet.',tools};}
 if(low.includes('report')||low.includes('daily review')){tools.push('REPORTS.GET_DAILY');return{text:generateDailyReview().sections.map(s=>`${s.title}: ${s.text}`).join(' | '),tools};}
 if(low.includes('weekly')){tools.push('REPORTS.GET_WEEKLY');return{text:generateWeeklyReview().sections.map(s=>`${s.title}: ${s.text}`).join(' | '),tools};}
 if(low.includes('create a task')){const title=text.replace(/create a task( to)?/i,'').trim()||'Commander-created work';tools.push('WORK.CREATE');return{text:`Created a structured work item. I assigned SHADOW by default because this is an unclassified manual analysis task; you can link it to an investigation or goal.`,tools,action:()=>{state.tasks.unshift({id:uuid('t'),title,status:'IN_PROGRESS',lifecycle:'CREATED',priority:'MEDIUM',agentId:'learning',agent:agentName('learning'),tokenId:c?.id||null,goalId:null,investigationId:null,evidence:['Commander chat'],dependencies:[],result:'',progress:5,created:nowTime(),updated:nowTime()});save();render();}};}
 if(low.includes('goal')){tools.push('GOALS.GET');return{text:`Current goals: ${state.goals.map(g=>`${g.name} ${Math.round(goalProgress(g))}%`).join(' | ')}. Commander monitors goals and can open an investigation automatically when progress is materially behind trajectory.`,tools};}
 if(low.includes('status')||low.includes('what is happening')||low.includes("what's happening")){const st=shadowStats();tools.push('GET_TODAY_SUMMARY','GET_ACTIVE_WORK');return{text:`${commanderBriefText()} Closed paper P/L is ${st.closedPL>=0?'+':''}$${st.closedPL.toFixed(2)}.`,tools};}
 if(c&&low.includes('why')){tools.push('GET_CANDIDATE','GET_SECURITY_RESULT');return{text:`${c.name}: ${c.decisionReason} Security ${c.security.warning}; Entry ${c.entry}/100; Remaining ${c.remaining}/100; final AI ${c.ai.final} ${c.ai.confidence}%.`,tools,entity:{type:'TOKEN',id:c.id}};}
 return{text:`I can run the operation rather than just answer questions. Ask me to investigate a bottleneck, assess a contract, explain a decision, review system health, summarize Shadow evidence, retrieve a memory, or create structured work. High-impact production changes remain approval-gated.`,tools:['ORCHESTRATOR.INTENT_ROUTER']};
}
function sendCommander(q){
 state.conversation.push({role:'user',text:q,tools:[]});const response=commanderRespond(q);const msg={role:'assistant',text:response.text,tools:response.tools,entity:response.entity||null};state.conversation.push(msg);state.conversation=state.conversation.slice(-80);save();renderChat();renderCommanderBrief();if(response.action)response.action();
}
function bindAutonomyEvents(){
 const tt=document.getElementById('todayTalk');if(tt)tt.onclick=()=>document.getElementById('commander').classList.add('open');
 document.querySelectorAll('[data-open-investigation]').forEach(el=>el.onclick=()=>openInvestigationModal(el.dataset.openInvestigation));
 const nai=document.getElementById('newAutonomyInvestigation');if(nai)nai.onclick=()=>openInvestigationForm();
 const mir=document.getElementById('markInboxRead');if(mir)mir.onclick=()=>{state.inbox.forEach(i=>i.read=true);save();render()};
 document.querySelectorAll('[data-inbox]').forEach(el=>el.onclick=()=>{const item=state.inbox.find(i=>i.id===el.dataset.inbox);if(!item)return;item.read=true;if(item.refType==='INVESTIGATION')openInvestigationModal(item.refId);if(item.refType==='REPORT'){state.activeView='reports';save();render()}save();});
 document.querySelectorAll('[data-investigate-goal]').forEach(el=>el.onclick=()=>{const g=state.goals.find(x=>x.id===el.dataset.investigateGoal);const inv=openCommanderInvestigation(`Goal behind trajectory: ${g.name}. Determine blockers and next evidence-backed action.`,{detectedBy:'USER',priority:'MEDIUM',goalId:g.id});save();render();toast(`${inv.code} opened`)});
 document.querySelectorAll('[data-brain-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-brain-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const type=b.dataset.brainMode;document.getElementById('memoryType').value=type;document.getElementById('memoryList').innerHTML=renderMemoryItems(type==='ALL'?state.memories:state.memories.filter(m=>m.type===type))});
 document.querySelectorAll('[data-memory-node]').forEach(g=>g.onclick=()=>{const m=state.memories.find(x=>x.id===g.dataset.memoryNode);if(m){openForm(m.title,`<div>${tag(m.type)} ${tag(m.status,statusClass(m.status))}</div><p style="font-size:12px;line-height:1.6">${escapeHtml(m.body)}</p><div class="evidence-list"><b>EVIDENCE</b>${(m.evidence||[]).map(e=>`<p>• ${escapeHtml(e)}</p>`).join('')}</div>`,()=>{});addLiveEvent('MEMORY_RETRIEVAL',`Retrieved ${m.title}`,'SECOND BRAIN',m.id);save();}});
 document.querySelectorAll('[data-cycle-service]').forEach(b=>b.onclick=()=>{const name=b.dataset.cycleService,s=state.services[name];const seq=['HEALTHY','DEGRADED','RATE_LIMITED','OFFLINE'];setService(name,seq[(seq.indexOf(s.status)+1)%seq.length]);autonomousHealthWatch();save();render()});
 document.querySelectorAll('[data-chat-view]').forEach(b=>b.onclick=()=>{state.activeView=b.dataset.chatView;document.getElementById('commander').classList.remove('open');save();render()});document.querySelectorAll('[data-chat-token]').forEach(b=>b.onclick=()=>openToken(b.dataset.chatToken));
}
function openInvestigationForm(){openForm('Commander Investigation',`<div class="field"><label>Objective</label><textarea id="invObjective" placeholder="Describe the problem or outcome. Commander will plan and delegate the work."></textarea></div><div class="field" style="margin-top:8px"><label>Priority</label><select id="invPriority"><option>MEDIUM</option><option selected>HIGH</option><option>CRITICAL</option></select></div><button class="btn good" id="createCommanderInv" style="margin-top:12px">Create investigation</button>`,()=>{document.getElementById('createCommanderInv').onclick=()=>{const q=document.getElementById('invObjective').value.trim();if(!q)return toast('Enter an objective');const inv=openCommanderInvestigation(q,{detectedBy:'USER',priority:document.getElementById('invPriority').value});closeForm();save();render();toast(`${inv.code} planned and delegated`)}})}
function openInvestigationModal(id){const inv=state.investigations.find(i=>i.id===id);if(!inv)return;const tasks=inv.taskIds.map(tid=>state.tasks.find(t=>t.id===tid)).filter(Boolean);openForm(`${inv.code} — ${inv.objective}`,`<div class="investigation-modal"><div class="grid metrics">${metric('Status',inv.lifecycle.replaceAll('_',' '),'Lifecycle')}${metric('Priority',inv.priority,'')}${metric('Detected',inv.detectedBy,'')}${metric('Team',inv.agentIds.length,'specialists')}</div><div class="section-head"><h2>WORK + EVIDENCE</h2></div>${tasks.map(t=>`<div class="card" style="margin-bottom:8px"><b>${agentName(t.agentId)}</b> ${tag(t.lifecycle,statusClass(t.lifecycle))}${progressBar(t.progress)}<p class="note">${escapeHtml(t.result||'Work not yet returned.')}</p></div>`).join('')}${inv.rootCause?`<div class="root-cause"><b>ROOT CAUSE</b><p>${escapeHtml(inv.rootCause)}</p><b>VALIDATION</b><p>${escapeHtml(inv.validation||'')}</p></div>`:''}<div class="section-head"><h2>TIMELINE</h2></div><div class="timeline">${inv.history.map(h=>`<div><time>${h[0]}</time><b>${h[1]}</b><span>${escapeHtml(h[2])}</span></div>`).join('')}</div></div>`,()=>{})}

// preserve critical failures: never overwrite a genuine critical security state in simulation
const _processCandidateOneStage=processCandidateOneStage;
processCandidateOneStage=function(c){if(c.stage==='SECURITY'&&(c.security.warning==='CRITICAL'||c.security.sellable===false)){rejectCandidate(c,c.security.warnings?.[0]||'Critical security condition');addLiveEvent('REJECTED',`${c.name} blocked by catastrophic security gate`,'SENTINEL',c.id);return}_processCandidateOneStage(c);addLiveEvent('PIPELINE',`${c.name} → ${STAGE_LABEL[c.stage]||c.stage}`,'SCANNER',c.id)};
const _closeShadowTrade=closeShadowTrade;
closeShadowTrade=function(t){_closeShadowTrade(t);const c=getCandidate(t.tokenId);publishReport({type:'SHADOW_POSTMORTEM',title:`Shadow post-mortem — ${c?.name||t.tokenId}`,severity:t.returnPct<0?'CAUTION':'INFO',summary:`Paper trade closed ${pct(t.returnPct)}. MFE ${pct(t.mfe)}, MAE ${pct(t.mae)}.`,findings:[...(t.postmortem?.worked||[]).map(x=>`Right: ${x}`),...(t.postmortem?.failed||[]).map(x=>`Wrong: ${x}`)],recommendation:t.postmortem?.test||'Compare against qualified and rejected controls before changing production.'});addLiveEvent('SHADOW',`${c?.name||t.tokenId} paper trade closed ${pct(t.returnPct)}`,'SHADOW',t.id)};
const _setService=setService;
setService=function(name,status){_setService(name,status);addLiveEvent('HEALTH',`${name} → ${status}`,'FORGE',name);autonomousHealthWatch();save();};
const _simStep=simStep;
simStep=function(){_simStep();progressOrchestration();autonomousHealthWatch();autonomousGoalWatch();save();render();};

ensureAutonomyState();save();

// Dynamic-injection bootstrap for GitHub Pages v5 wrapper.
resetState=function(){state=initialState();ensureAutonomyState();save();stopSimulation();render();toast("Demo reset to Autonomous OS baseline")};
ensureAutonomyState();
document.title="KZEL Autonomous AI Operating System — Prototype";
save();
render();
if(state.simRunning){stopSimulation();startSimulation();}


bindGlobal();render();
if(state.simRunning)startSimulation();
</script>
